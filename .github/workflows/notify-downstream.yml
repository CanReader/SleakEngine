name: Notify Downstream Repos

on:
  push:
    branches: [main]

# SleakCraft is verified by its own nightly job instead of a dispatch:
# DISPATCH_TOKEN does not currently grant access to that repository. To make
# it instant, add SleakCraft to the token's repository access and list it in
# the matrix below.
jobs:
  notify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - SleakEngine-Empty
          - SleakEngine-FPP
    steps:
      - name: Notify ${{ matrix.repo }}
        run: |
          gh api repos/CanReader/${{ matrix.repo }}/dispatches \
            -f event_type=engine-updated \
            -f "client_payload[sha]=${{ github.sha }}" \
            -f "client_payload[ref]=${{ github.ref }}"
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
