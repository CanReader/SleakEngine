name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format (changed lines)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      # The existing tree predates the style, so only lines this PR touches
      # are checked. New code stays clean without a repo-wide reformat.
      - name: Check formatting of changed lines
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          OUT=$(git-clang-format --diff "origin/${{ github.base_ref }}" \
                  --extensions cpp,hpp,h,cc 2>&1 || true)
          case "$OUT" in
            *"no modified files to format"*|*"did not modify any files"*|"")
              echo "Formatting is clean."
              ;;
            *)
              echo "$OUT"
              echo
              echo "Run: git-clang-format origin/${{ github.base_ref }}"
              exit 1
              ;;
          esac

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Debug
            os: ubuntu-latest
            config: Debug
          - name: Linux Release
            os: ubuntu-latest
            config: Release
          - name: Linux Clang Release
            os: ubuntu-latest
            config: Release
            cc: clang
            cxx: clang++
          - name: Windows Debug
            os: windows-latest
            config: Debug
          - name: Windows Release
            os: windows-latest
            config: Release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxmu-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            glslc || sudo apt-get install -y glslang-tools

      - name: Cache compiler output
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.name }}-
            ccache-${{ runner.os }}-

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc || 'gcc' }}
          CXX: ${{ matrix.cxx || 'g++' }}
        run: |
          ccache -M 2G
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSDL_IBUS=OFF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Build leaves the source tree clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "The build modified or created tracked files."
            exit 1
          fi

      - name: Report ccache statistics
        if: runner.os == 'Linux'
        run: ccache -s | head -8

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeCache.txt

  shaders:
    name: Shaders compile and are committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install glslc
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Every Vulkan shader compiles
        run: |
          cd assets/shaders
          fail=0
          for src in *.vert *.frag; do
            [ -e "$src" ] || continue
            case "$src" in *_gl.vert|*_gl.frag) continue ;; esac
            if ! glslc "$src" -o /tmp/out.spv; then
              echo "FAILED to compile: $src"
              fail=1
            fi
          done
          exit $fail

      - name: Every Vulkan shader has committed SPIR-V
        run: |
          cd assets/shaders
          missing=0
          for src in *.vert *.frag; do
            [ -e "$src" ] || continue
            case "$src" in *_gl.vert|*_gl.frag) continue ;; esac
            if [ ! -f "$src.spv" ]; then
              echo "Missing committed SPIR-V for $src"
              missing=1
            fi
          done
          [ $missing -eq 0 ] && echo "All Vulkan shaders have committed SPIR-V."
          exit $missing

      - name: No SPIR-V without a source
        run: |
          cd assets/shaders
          orphan=0
          for spv in *.spv; do
            [ -e "$spv" ] || continue
            if [ ! -f "${spv%.spv}" ]; then
              echo "Orphan SPIR-V with no source: $spv"
              orphan=1
            fi
          done
          exit $orphan

      # The committed .spv are what a machine without glslc ships. glslc
      # releases emit different code for the same source, so instead of a
      # byte compare, any GLSL edit has to come with its recompiled .spv.
      - name: Edited GLSL comes with its SPIR-V
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare against."
            exit 0
          fi
          BASE=$(git merge-base "$BASE" HEAD)
          changed=$(git diff --name-only "$BASE" HEAD -- assets/shaders)
          stale=0
          for src in $(echo "$changed" | grep -E '\.(vert|frag)$' | grep -vE '_gl\.(vert|frag)$'); do
            [ -f "$src" ] || continue
            echo "$changed" | grep -qx "$src.spv" && continue
            # Edits that compile to the same code (comments) need no new .spv
            ext="${src##*.}"
            if git show "$BASE:$src" > "/tmp/base.$ext" 2>/dev/null &&
               glslc "/tmp/base.$ext" -o /tmp/base.spv &&
               glslc "$src" -o /tmp/head.spv &&
               cmp -s /tmp/base.spv /tmp/head.spv; then
              continue
            fi
            echo "$src changed but $src.spv did not. Run: glslc $src -o $src.spv"
            stale=1
          done
          exit $stale

  # An engine change that breaks the game should be caught at review time, not
  # by the game's nightly job the following morning.
  game-build:
    name: Downstream game still builds
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 90
    steps:
      - name: Check out this engine revision
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: SleakEngine

      - name: Check out the game
        uses: actions/checkout@v7
        with:
          repository: CanReader/SleakCraft
          path: SleakCraft

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxmu-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-downstream-${{ github.sha }}
          restore-keys: ccache-downstream-

      - name: Build the game against this engine
        working-directory: SleakCraft
        run: |
          ccache -M 2G
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DSDL_IBUS=OFF
          cmake --build build

  # The existing tree predates the checks, so only lines this PR touches are
  # analyzed. Advisory for now: it reports findings without blocking a merge.
  clang-tidy:
    name: Static analysis (changed lines)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-tidy ninja-build pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxmu-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Generate the compilation database
        run: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSDL_IBUS=OFF

      - name: Analyze changed files
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=ACM \
                    "origin/${{ github.base_ref }}"...HEAD \
                    -- 'src/*.cpp' 'include/**/*.hpp' | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "No C++ sources changed."
            exit 0
          fi
          echo "Analyzing: $files"
          clang-tidy -p build $files || true
