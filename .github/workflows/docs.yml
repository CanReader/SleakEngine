name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'src/**'
      - 'docs/**'
      - 'Doxyfile'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and publish the manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Build documentation
        run: doxygen Doxyfile

      # Warnings are treated as failures so the published manual never
      # documents a symbol that no longer exists.
      - name: Fail on documentation warnings
        run: |
          if [ -s docs/doxygen_warnings.log ]; then
            echo "Doxygen reported warnings:"
            cat docs/doxygen_warnings.log
            exit 1
          fi
          echo "No documentation warnings."

      - name: Publish to GitHub Pages
        run: |
          cd docs/html
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: rebuild from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "Published https://canreader.github.io/SleakEngine/"
