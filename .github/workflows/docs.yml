name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'src/**'
      - 'docs/**'
      - 'Doxyfile'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DOXYGEN_VERSION: '1.18.0'

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and publish the manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The theme files (DoxygenLayout.xml, header.html) are generated by a
      # specific Doxygen release and emit tags older versions reject. Pinning
      # the version keeps the zero-warning gate below meaningful instead of
      # reporting noise from a toolchain mismatch.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          curl -fsSL "https://www.doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" \
            -o /tmp/doxygen.tar.gz
          mkdir -p /tmp/doxygen && tar -xzf /tmp/doxygen.tar.gz -C /tmp/doxygen --strip-components=1
          sudo install -m 755 /tmp/doxygen/bin/doxygen /usr/local/bin/doxygen
          doxygen --version

      - name: Build documentation
        run: doxygen Doxyfile

      # Warnings are treated as failures so the published manual never
      # documents a symbol that no longer exists.
      - name: Fail on documentation warnings
        run: |
          if [ -s docs/doxygen_warnings.log ]; then
            echo "Doxygen reported warnings:"
            cat docs/doxygen_warnings.log
            exit 1
          fi
          echo "No documentation warnings."

      - name: Publish to GitHub Pages
        run: |
          cd docs/html
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: rebuild from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "Published https://canreader.github.io/SleakEngine/"
